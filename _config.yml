# Site settings for ayansengupta17.github.io
# Theme: Minimal Mistakes (remote), docs at https://mmistakes.github.io/minimal-mistakes/docs/configuration/

remote_theme             : "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin    : "air" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise", "catppuccin_latte", "catppuccin_mocha"

locale                   : "en-US"
title                    : "Ayan Sengupta"
title_separator          : "-"
subtitle                 : "Co-Founder & CEO, MyImmune"
name                     : "Ayan Sengupta"
description              : "Ayan Sengupta - Co-Founder & CEO of MyImmune. AI for immunology, diagnostics and antibody discovery."
url                      : "https://ayansengupta.dev"
baseurl                  : ""
repository               : "ayansengupta17/ayansengupta17.github.io"
teaser                   : # fallback teaser image, e.g. "/images/500x300.png"
logo                     :
masthead_title           :
breadcrumbs              : false
words_per_minute         : 200
enable_copy_code_button  : true
search                   : true
search_full_content      : true

comments:
  provider               : false

atom_feed:
  path                   :
  hide                   : true

# SEO
google_site_verification :
bing_site_verification   :

# Social sharing
twitter:
  username               :
og_image                 : "/images/me.jpg"
og_image_alt             : "Portrait of Ayan Sengupta"
social:
  type                   : Person
  name                   : "Ayan Sengupta"
  links:
    - "https://www.linkedin.com/in/ayansengupta17/"
    - "https://github.com/ayansengupta17"
    - "https://scholar.google.com/citations?user=llfoyOIAAAAJ"
    - "https://www.myimmune.ai/"

# Analytics (GA4). The old Universal Analytics ID UA-136087327-2 stopped collecting data in July 2023.
analytics:
  provider               : "google-gtag"
  google:
    tracking_id          : "G-J2MQNKHSKE"
    anonymize_ip         : false

# Site author (sidebar)
author:
  name             : "Ayan Sengupta"
  avatar           : "/images/me.jpg"
  bio              : "Co-Founder & CEO of MyImmune. AI for immunology, diagnostics and antibody discovery."
  location         : "Tokyo, Japan"
  email            : "ayan.sengupta@myimmune.ai"
  links:
    - label: "MyImmune"
      icon: "fas fa-fw fa-link"
      url: "https://www.myimmune.ai/"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/ayansengupta17/"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=llfoyOIAAAAJ"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ayansengupta17"
    - label: "MentorCruise"
      icon: "fas fa-fw fa-chalkboard-user"
      url: "https://mentorcruise.com/mentor/ayansengupta/"

# Site footer
footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/ayansengupta17/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ayansengupta17"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=llfoyOIAAAAJ"

# Reading files
include:
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .bundle
  - .asset-cache
  - .jekyll-assets-cache
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - package.json
  - SECURITY.md
  - log
  - node_modules
  - tmp
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Asia/Tokyo

# Collections
collections:
  projects:
    output: true
    permalink: /:collection/:path/

# Plugins (whitelisted by GitHub Pages)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-redirect-from
  - jekyll-remote-theme
  - jemoji

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-redirect-from
  - jekyll-remote-theme
  - jemoji

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
      classes: wide
  - scope:
      path: "_projects"
      type: projects
    values:
      layout: single
      author_profile: true
      share: true
      classes: wide
