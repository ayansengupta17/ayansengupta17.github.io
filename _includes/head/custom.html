<!-- Favicons: images/favicon.svg is the source; PNG/ICO sizes rendered from it -->
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="32x32">
<link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon.png' | relative_url }}">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
<meta name="theme-color" content="#0092ca">
<script>
  /* Apply the remembered colour scheme before first paint. Light is the default. */
  (function () { try { if (localStorage.getItem("theme") === "dark") { document.documentElement.setAttribute("data-theme", "dark"); } } catch (e) {} })();
</script>
