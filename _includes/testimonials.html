{%- assign t = site.data.testimonials -%}
{%- assign s = t.summary -%}
<section class="testimonials" id="reviews" aria-labelledby="reviews-heading">
  <h2 id="reviews-heading">What mentees say</h2>
  <p class="testimonials__summary">
    <span class="testimonials__stars" aria-hidden="true">★★★★★</span>
    <strong>{{ s.rating }} out of 5</strong> from {{ s.count }} ratings on
    <a href="{{ s.profile_url }}" rel="noopener">MentorCruise</a>.
    {{ s.note }}.
    {%- for b in s.badges %} <span class="testimonials__badge">{{ b }}</span>{% endfor %}
  </p>

  <div class="testimonials__grid">
    {%- for r in t.reviews %}
    <figure class="testimonial">
      <blockquote class="testimonial__quote">{{ r.quote }}</blockquote>
      <figcaption class="testimonial__meta">
        <span class="testimonial__name">{{ r.name }}</span>
        <span class="testimonial__detail">
          {{- r.service -}}
          {%- if r.plan %} · {{ r.plan }}{% endif -%}
          {%- if r.duration %} · {{ r.duration }}{% endif -%}
          {%- if r.date %} · <time datetime="{{ r.date | date: '%Y-%m-%d' }}">{{ r.date | date: '%B %Y' }}</time>{% endif -%}
        </span>
      </figcaption>
    </figure>
    {%- endfor %}
  </div>

  <p class="testimonials__cta">
    <a class="btn btn--primary" href="{{ s.profile_url }}" rel="noopener">Read all reviews on MentorCruise</a>
  </p>
</section>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Service",
  "name": "Mentorship by {{ site.author.name }}",
  "serviceType": "Mentorship",
  "url": "{{ page.url | absolute_url }}",
  "sameAs": "{{ s.profile_url }}",
  "provider": {
    "@type": "Person",
    "name": "{{ site.author.name }}",
    "url": "{{ site.url }}/",
    "sameAs": "{{ s.profile_url }}"
  },
  "aggregateRating": {
    "@type": "AggregateRating",
    "ratingValue": "{{ s.rating }}",
    "bestRating": "5",
    "ratingCount": "{{ s.count }}"
  },
  "review": [
    {%- for r in t.reviews %}
    {
      "@type": "Review",
      "author": { "@type": "Person", "name": {{ r.name | jsonify }} },
      {%- if r.date %}
      "datePublished": "{{ r.date | date: '%Y-%m-%d' }}",
      {%- endif %}
      "reviewRating": { "@type": "Rating", "ratingValue": "{{ r.rating }}", "bestRating": "5" },
      "reviewBody": {{ r.quote | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ]
}
</script>
